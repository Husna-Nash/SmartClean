<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Clean - Cleanup Complete</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="cleanup-complete-page">

    <div class="cleanup-complete-card">

        <div class="cleanup-success-icon">
            ✓
        </div>

        <h1>Cleanup Complete!</h1>

        <p class="cleanup-message">
            Your selected files have been processed successfully.
        </p>


        <!-- STORAGE FREED -->

        <div class="freed-storage-box">

            <h2 id="freedStorage">
                0 GB
            </h2>

            <p>
                Storage Freed
            </p>

        </div>


        <!-- FILE COUNT -->

        <div class="cleaned-files-box">

            <h2 id="cleanedFiles">
                0
            </h2>

            <p>
                Files Selected for Cleanup
            </p>

        </div>


        <p class="cleanup-note">
            Your storage is now ready for a fresh start.
        </p>


       

    </div>

</main>


<script src="cleanup-complete.js"></script>

</body>

</html>
