<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Clean - Organization</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="organization-page">

    <h1>ORGANIZATION</h1>

    <p id="organizationMessage">
        Select a category to organize the remaining items.
    </p>

    <!-- CATEGORY BUTTONS -->
    <div id="organizationCategories"
         class="organization-categories">
    </div>

    <!-- SELECTED CATEGORY ORGANIZATION -->
    <div id="organizationContent"
         class="organization-content">
    </div>
    <button
    type="button"
    class="organization-start-again-button"
    onclick="startAgain()">
    ↻ Start Again
</button>

</main>


<script src="organization.js"></script>

</body>
</html>
