<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Clean - Unnecessary Files</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">SMART CLEAN</div>

    <nav>
        <a href="index.html">Home</a>
        
        
        <a href="about.html">About</a>
    </nav>

</header>


<main class="unnecessary-page">

    <div class="unnecessary-header">

        <h1>We found some things to clean</h1>

        <p>
            Review the categories below to see what can be removed.
        </p>

    </div>


    <div class="cleanup-summary">

        <h2>7.5 GB</h2>

        <p>
            Potential storage to free
        </p>

    </div>


    <!-- CATEGORIES -->

    <div class="cleanup-category-grid">

        <div class="cleanup-category-card">

            <div class="cleanup-icon">📑</div>

            <h2>Duplicate Files</h2>

            <p>2.4 GB</p>

        </div>


        <div class="cleanup-category-card">

            <div class="cleanup-icon">📱</div>

            <h2>Old Screenshots</h2>

            <p>1.1 GB</p>

        </div>


        <div class="cleanup-category-card">

            <div class="cleanup-icon">📦</div>

            <h2>Large Files</h2>

            <p>3.2 GB</p>

        </div>


        <div class="cleanup-category-card">

            <div class="cleanup-icon">✉️</div>

            <h2>Email Attachments</h2>

            <p>0.8 GB</p>

        </div>

    </div>


    <!-- OVERALL REVIEW BUTTON -->

    <div class="overall-review-button-container">

        <button
            class="overall-review-button"
            onclick="goToReview()">

            Review & Select

        </button>

    </div>

</main>


<script src="unnecessary.js"></script>

</body>

</html>
